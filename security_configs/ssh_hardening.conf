# Managed by SecurityHardening suite
# Drop-in for /etc/ssh/sshd_config.d/ — OpenSSH 9+/10 (Ubuntu 26.04+, Debian)
#
# On Ubuntu 24.04+/26.04+, listening port comes from ssh.socket /
# sshd-socket-generator. After changing Port, run:
#   systemctl daemon-reload && systemctl restart ssh.socket
#
# Post-quantum: KexAlgorithms are applied by the installer according to
# SSH_KEX_MODE (compatibility | pq-preferred | pq-only). pq-only is never
# the silent default — first run chooses, and a second SSH connection is
# verified before pq-only is applied.

PermitRootLogin no
PasswordAuthentication yes
PubkeyAuthentication yes
PermitEmptyPasswords no
KbdInteractiveAuthentication no
X11Forwarding no
MaxAuthTries 3
MaxSessions 2
LoginGraceTime 60
ClientAliveInterval 300
ClientAliveCountMax 2
AllowAgentForwarding no
AllowTcpForwarding no
DebianBanner no
PrintMotd no
UsePAM yes

# Prefer Ed25519 host key (classical signature; PQ protects the session KEX)
HostKey /etc/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_ecdsa_key
HostKey /etc/ssh/ssh_host_rsa_key

# PLACEHOLDER_SSH_PQ_CRYPTO
